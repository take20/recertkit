# Template: verify a certificate chain as a release gate. See README.md in this directory.
name: release-gate
on:
  push:
    tags: ["v*"]
jobs:
  recertification-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install git+https://github.com/take20/recertkit@v1.4.1
      - name: verify the whole chain with the relying party's key and policy
        run: |
          recertkit verify-chain --root certs/root.json --links $(ls certs/derived_*.json | sort) \
            --trust release=release/trusted.pub --policy release/policy.json \
            --json-report chain_report.json
      - name: check that the files about to be released are the ones the last certificate records
        run: |
          last=$(ls certs/derived_*.json | sort | tail -1)
          inv=certs/$(python -c "import json, sys; print(json.load(open(sys.argv[1]))['derived_inventory']['file'])" "$last")
          (cd deploy && sha256sum --check "../$inv")
          test "$(find deploy -type f | wc -l)" -eq "$(grep -c -E '^[0-9a-f]{64} ' "$inv")"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: recertification-report, path: chain_report.json}
  release:
    needs: recertification-gate
    runs-on: ubuntu-latest
    steps:
      - run: echo "publish the files of deploy/ here; this job runs only when the record is VALID, the policy ACCEPTED, and deploy/ matches the last inventory"
